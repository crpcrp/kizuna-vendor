# The PaddleOCR payload is built on a developer machine with
# scripts/build-paddleocr-win-x64.ps1 and committed through Git LFS. Building it
# here instead was tried and abandoned: a hosted runner has to pull ~1 GB of LFS
# objects, download ~500 MB of Paddle Inference and OpenCV from a CDN on the
# other side of the world, and then compile abseil plus the whole cpp_infer tree
# on four cores, all with a cold cache on every run. The same build finishes in
# about two minutes on a developer box that keeps its dependency cache.
#
# So this job does not build. It checks that whatever binary was committed is
# internally consistent and still meets its latency budget on a clean machine
# that never saw the build tree.
name: Verify PaddleOCR payload

on:
  push:
    paths:
      - paddleocr/**
      - scripts/verify-paddleocr-win-x64.ps1
      - SHA256SUMS.txt
      - manifest.json
  pull_request:
    paths:
      - paddleocr/**
      - scripts/verify-paddleocr-win-x64.ps1
      - SHA256SUMS.txt
      - manifest.json
  workflow_dispatch:

# A branch pushed as a pull request otherwise verifies the same commit twice.
concurrency:
  group: verify-paddleocr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Only the PaddleOCR payload is needed; pulling every LFS object in the
      # repository would fetch ffmpeg, mpv and the MeCab dictionaries too.
      - name: Fetch the PaddleOCR LFS objects
        shell: bash
        run: git lfs pull --include="paddleocr/**"

      # A hosted runner has four cores against a desktop's sixteen and measures
      # about 2.2 s where the desktop measures 1.6 s, so it gets its own
      # ceiling. 4 s leaves room for a noisy neighbour while still catching a
      # real regression; the measured numbers are printed either way.
      - name: Verify checksums, recognition and warm latency
        shell: powershell
        run: ./scripts/verify-paddleocr-win-x64.ps1 -MaxWarmRecognitionMs 4000
