# Packages the payloads at a chosen commit and attaches them to a GitHub
# release. This is the normal way to publish; scripts/publish-payloads.sh is the
# same code path and stays runnable locally for a dry run.
#
# Running it here rather than on a developer machine buys three things: the
# release is created by a GITHUB_TOKEN scoped to this repository instead of
# someone's personal CLI login, the run is a permanent record of which commit
# produced which asset hash, and the archives cannot pick up anything that was
# only ever on one laptop.
#
# It does cost Git LFS bandwidth, because a runner has to materialise the
# payload before it can package it. That is the whole reason to publish assets
# at all, so it is worth being precise about the trade: this pulls once per
# publish, and publishes only happen when a payload changes. The pull that
# mattered was the one Kizuna did on every build that missed its cache, and
# that one is gone. Only the requested platform's trees are pulled, so a Linux
# publish costs ~58 MB rather than ~855 MB.
name: Publish payload archives

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which payload archives to publish
        type: choice
        options: [all, win32-x64, linux-x64]
        default: all
      replace:
        description: Overwrite an asset that is already published (see below)
        type: boolean
        default: false

# Two publishes racing on the same tag would upload assets in an unpredictable
# order, and only one of the hashes would be the one anybody pinned.
concurrency:
  group: publish-payloads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pointers only: the pull below is filtered, and checking out with LFS
      # enabled would fetch both platforms regardless of the chosen input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false

      # Asked of the script rather than restated here. A list that drifted from
      # the one the script packages would pull the wrong trees, and every byte
      # pulled is charged against a metered LFS bandwidth quota.
      - name: Select the trees to materialise
        id: trees
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          include="$(./scripts/publish-payloads.sh --platform "$PLATFORM" --print-lfs-include)"
          echo "Materialising $include"
          echo "include=$include" >>"$GITHUB_OUTPUT"

      - name: Fetch the payload from Git LFS
        env:
          INCLUDE: ${{ steps.trees.outputs.include }}
        run: git lfs pull --include="$INCLUDE"

      # The script re-verifies every file against SHA256SUMS.txt and refuses to
      # package an unresolved pointer, so a partial pull fails here rather than
      # producing an archive that extracts cleanly and matches nothing.
      #
      # The script prints the `source` block that Kizuna's resources.lock.json
      # needs, archive hashes included. That belongs on the run summary rather
      # than buried in the log, because it is the one output a human has to
      # copy. The archives themselves are not kept as artifacts: they are
      # already release assets, and a second quarter-gigabyte copy buys nothing.
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          REPLACE: ${{ inputs.replace }}
        run: |
          # Without this, tee's exit status hides a failed publish.
          set -o pipefail
          arguments=(--platform "$PLATFORM")
          # Not `[ … ] && arguments+=(…)`: the step runs under `bash -e`, where a
          # false test as a whole statement ends the job.
          if [ "$REPLACE" = true ]; then arguments+=(--replace); fi
          ./scripts/publish-payloads.sh "${arguments[@]}" | tee publish.log
          {
            echo '### resources.lock.json'
            echo '```json'
            sed -n '/^resources.lock.json source block/,/^$/p' publish.log | tail -n +2
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
